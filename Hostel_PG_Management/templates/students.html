<!DOCTYPE html>
<html>

<head>
    <title>Students - Hostel & PG Management</title>
</head>

<body>

    <h1>Hostel & PG Management System</h1>

    <h2>Student Management</h2>

    <hr>

    <h3>Add Student</h3>

    <form method="POST" action="/add_student">

        <label>Student Name:</label><br>
        <input type="text" name="name" required>

        <br><br>

        <label>Email:</label><br>
        <input type="email" name="email">

        <br><br>

        <label>Phone:</label><br>
        <input type="text" name="phone">

        <br><br>

        <label>Room Number:</label><br>
        <input type="text" name="room_no">

        <br><br>

        <button type="submit">
            Add Student
        </button>

    </form>

    <hr>

    <h3>Student List</h3>

    <table border="1" cellpadding="10">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Room Number</th>
        </tr>

        {% for student in students %}

        <tr>

            <td>
                {{ student["id"] }}
            </td>

            <td>
                {{ student["name"] }}
            </td>

            <td>
                {{ student["email"] }}
            </td>

            <td>
                {{ student["phone"] }}
            </td>

            <td>
                {{ student["room_no"] }}
            </td>

        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/admin_dashboard">
        Back to Dashboard
    </a>

</body>

</html>
